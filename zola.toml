base_url = "https://tecnoter.io"
title = "tecnoterio"
description = "Systems engineering: Unix and Linux, infrastructure as code, GitOps, and observability."
compile_sass = true
build_search_index = true
generate_feeds = true

taxonomies = [
    {name = "tags", singular = "tag"},
    {name = "categories", singular = "category"},
]

[markdown.highlighting]
theme = "catppuccin-mocha"

[extra]
default_mode = "terminal"

socials = [
    {name = "github", url = "https://github.com/tecnoterio"},
    {name = "bluesky", url = "https://bsky.app/profile/tecnoterio"},
]

system_info = {uptime = "42 days, 13:07", load_average = "0.42, 0.38, 0.45", motd_suggestion = "Type 'help' to see available commands. Use Ctrl+D or 'logout' to exit.", node_name = "tecnoterio node 1"}

menu_main = [
    {name = "Posts", url = "/posts/", weight = 1},
    {name = "Tags", url = "/tags/", weight = 2},
    {name = "Terminal", url = "/terminal/", weight = 3},
]
nav = [
    {title = "About", url = "/pages/bio/", cmd = "cat pages/bio"},
    {title = "Expertise", url = "/pages/skills/", cmd = "cat pages/skills"},
    {title = "Services", url = "/pages/services/", cmd = "cat pages/services"},
    {title = "Vision", url = "/pages/vision/", cmd = "cat pages/vision"},
    {title = "Contact", url = "/pages/contact/", cmd = "cat pages/contact"},
]

# The five expertise sub-pages, split out of skills.md. Kept separate from
# `nav` so the directory stays five items and the detail stays one click away.
expertise = [
    {title = "Development", url = "/pages/development/", cmd = "cat pages/development"},
    {title = "Systems", url = "/pages/systems/", cmd = "cat pages/systems"},
    {title = "Delivery", url = "/pages/delivery/", cmd = "cat pages/delivery"},
    {title = "Observability", url = "/pages/observability/", cmd = "cat pages/observability"},
    {title = "Security", url = "/pages/security/", cmd = "cat pages/security"},
]

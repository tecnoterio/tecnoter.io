[bio]
title = "Company Biography"
content = "Tecnoter.io is a systems engineering company with a long career building software and the infrastructure it runs on. Systems work, networking, and infrastructure were the foundation; the recent centre of gravity is large event-driven systems."

[skills]
title = "Technical Deck"
content = "Our expertise spans: C, C++, Go, Python, and TypeScript; event-driven systems including ordering, idempotency, and replay; Unix and Linux system engineering; delivery pipelines and supply chain security; Kubernetes and GitOps with Argo; deep open source observability with the Grafana LGTM stack; and data and analytics, from telemetry queries to classical modelling."

[contact]
title = "Contact Protocol"
content = "Email: contact@tecnoter.io\nSecure Comms: PGP key available on request\nGitHub: https://github.com/tecnoterio"

[vision]
title = "Corporate Vision"
content = "To keep infrastructure legible: reproducible over assembled, observable over assumed, portable by construction."

[services]
title = "Our Services"
content = "BUILD: Application development, event-driven systems, delivery pipelines, supply chain security.\nRUN: Platform and infrastructure as code, Kubernetes and GitOps, cloud-agnostic architecture, configuration at scale.\nIMPROVE: Observability and data, performance and reliability, legacy and long-lived systems, AI-assisted delivery (opt-in)."

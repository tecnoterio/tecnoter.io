<div id="terminal" {% if current_path == "/" and config.extra.default_mode == "terminal" %}{% else %}style="display: none;"{% endif %}>
  <div id="output"></div>
  <div id="input-line">
    <span id="prompt"></span>
    <input id="input" autofocus autocomplete="off" spellcheck="false">
    <span id="suggestion"></span>
    <span id="cursor"></span>
  </div>
</div>

{% include "partials/hub_frame.html" %}

<div id="pager" hidden>
  <div id="pager-header">
    <span id="pager-title"></span>
    <span class="pager-hint">— press q to quit</span>
  </div>
  <pre id="pager-content"></pre>
</div>

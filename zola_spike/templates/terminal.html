<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Terminal | {{ config.title }}</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/terminal.css">
</head>
<body class="mode-terminal">
  <div id="terminal-page">
    <div id="terminal" class="terminal">
      <pre id="terminal-output" class="terminal-output"></pre>
      <input id="cmd-input" class="cmd-input" autocomplete="off" placeholder="Enter command"/>
      <br>
      <button class="cmd-btn" onclick="runCommand('whoami')">whoami</button>
      <button class="cmd-btn" onclick="runCommand('uptime')">uptime</button>
      <button class="cmd-btn" onclick="runCommand('fortune')">fortune</button>
      <a class="cmd-btn" href="/">&laquo; BACK TO INDEX</a>
    </div>
  </div>

  <style>
    #terminal-page { padding: 24px; }
    .terminal   { color:#00ff02; background:#111; padding:20px;
                  font-family:monospace; white-space:pre-wrap;
                  height:300px; overflow:auto; border:1px solid #333; }
    .cmd-input  { width:100%; background:#222; color:#00ff02;
                  border:none; padding:5px; font-family:monospace;
                  margin-top:10px; }
    .cmd-btn    { background:#333; color:#00ff02; border:1px solid #555;
                  padding:5px 10px; cursor:pointer; margin-top:5px;
                  display:inline-block; text-decoration:none; }
    .cmd-btn:hover { background:#444; }
  </style>

  <script type="module" src="/js/terminal-page.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Terminal</title>
  <style>
    #terminal-output {
      color:#00ff00;
      background:#111;
      padding:20px;
      font-family:monospace;
      white-space:pre-wrap;
      height:300px;
      overflow:auto;
      border:1px solid #333;
    }
    #cmd-input {
      width:100%;
      background:#222;
      color:#00ff00;
      border:none;
      padding:5px;
      font-family:monospace;
      margin-top:10px;
    }
    button {
      margin-top:5px;
      padding:5px 10px;
      background:#333;
      color:#00ff00;
      border:1px solid #555;
      cursor:pointer;
    }
    button:hover { background:#444; }
  </style>
</head>
<body>
<div id="terminal-output">Welcome to the minimal terminal. Type a command:</div>
<input id="cmd-input" autocomplete="off" placeholder="Enter command"/>
<br>
<button onclick="runCommand('whoami')">whoami</button>
<button onclick="runCommand('uptime')">uptime</button>

<script>
  async function runCommand(cmd) {
    const out = document.getElementById('terminal-output');
    try {
      const resp = await fetch(`/terminal/commands/${cmd}.txt`);
      const txt = await resp.text();
      out.innerHTML = txt;
    } catch (e) {
      out.innerHTML = 'Command not found';
    }
  }
</script>
</body>
</html>

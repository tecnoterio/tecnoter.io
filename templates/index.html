<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>{{ config.title }}</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/terminal.css">
  <noscript>
    <style>
      #low-tech-hub { display: block !important; }
      #terminal, .hardware-controls, .bezel-logo, .crt-roll, .crt-overlay { display: none !important; }
      body { overflow: auto !important; background: #111 !important; display: block !important; padding: 20px !important; }
      .hub-frame { width: 100% !important; max-width: 800px; margin: 0 auto; }
    </style>
  </noscript>
</head>
<body class="">
{% include "partials/hardware.html" %}
{% include "partials/hub_frame.html" %}
{% include "partials/terminal_frame.html" %}

<script>
  window.siteSocial = [];
  {% for s in config.extra.socials %}
  window.siteSocial.push({name: "{{ s.name }}", url: "{{ s.url }}"});
  {% endfor %}
  
  window.siteFortunes = [
    {text: "Simplicity is the soul of efficiency."},
    {text: "Code is like humor. When you have to explain it, it's bad."},
    {text: "Fix the cause, not the symptom."},
    {text: "The best error message is the one that never appears."},
    {text: "Small pieces, loosely joined."},
    {text: "Minimalism is not a lack of something. It is simply the perfect amount of something."},
    {text: "Optimization is the root of all evil if done prematurely."},
    {text: "A terminal is a conversation with the machine."},
    {text: "Retro-functionalism: High tech, low noise."},
    {text: "Uplink established. Truth incoming."}
  ];
  
  window.isInternalPage = false;
</script>
<script type="module" src="/js/terminal.js"></script>
</body>
</html>

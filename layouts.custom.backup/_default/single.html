<!DOCTYPE html>
<html>
  {{ partial "head.html" . }}
  <body>
    {{ partial "header.html" . }}

    <h1>{{ .Title }}</h1>
{{ with .Params.tags }}
<p>
  Tags:
  {{ range . }}
    <a href="/tags/{{ . | urlize }}/">{{ . }}</a>
  {{ end }}
</p>
{{ end }}

    <article>
      {{ .Content }}
    </article>

    {{ partial "footer.html" . }}
  </body>
</html>

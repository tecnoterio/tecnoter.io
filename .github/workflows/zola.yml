name: Deploy Zola site to Pages

on:
  # Runs on pushes to main branch
  push:
    branches: ["main"]

  # Runs on pull requests - build only, no deploy
  pull_request:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      # Output goes to zola_spike/static/js/wasm so the Zola build copies it
      # into public/ like any other static asset. zola build clears public/,
      # so building straight into public/ would be undone on the next build.
      - name: Build WASM
        run: |
          cd shell_wasm
          wasm-pack build --target web --out-dir ../zola_spike/static/js/wasm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Build site
        run: |
          cd zola_spike
          zola build --base-url "${{ steps.pages.outputs.base_url }}/"
          python3 scripts/build-index-json.py .
          python3 scripts/check-parity.py .

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./zola_spike/public

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
